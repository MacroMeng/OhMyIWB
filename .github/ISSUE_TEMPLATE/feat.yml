name: 功能请求
description: 我想向 OMI Web 中加入一项新的功能。
title: "*输入标题"
labels: ["SiteFeat"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        感谢您贡献您的想法。
        请使用简洁明确的标题描述您希望增加或改进的功能。便于开发者了解您的想法。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已确认我想要的功能还没有实现，我也已在 [Issues](https://github.com/OhMyIWB/issues?q=-label%3ABug) 中搜索过，确认我想要的功能未被提交过。
          required: true
        - label: 我已确认该需求属于 OMI Web 的核心功能的扩展、且是用户广泛需要的，而不是其他乱七八糟的东西和偏离 *Boring* 这个目标的东西。
          required: true
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。
        - label: 我已知晓由于开发者时间精力有限，我提交的功能请求可能需要比较久的时间才能实现，或者被直接拒绝。
          required: true
  - type: markdown
    attributes:
      value: |
        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。**尽量避免使用需要登陆或安装客户端才能接收附件的网盘（如\*度网盘、\*克网盘、1\*3网盘等）上传附件**，以避免开发者因不具有对应网盘客户端或账户而延误问题诊断。
  - type: textarea
    id: back
    attributes:
      label: 背景与动机
      description: 为什么你认为需要此功能？这个功能对你和其他用户有多重要？
    validations:
      required: true
  - type: textarea
    id: requested-feature
    attributes:
      label: 想要实现或优化的功能
      description: 详细地描述一下你想要的功能，联系到哪些已经存在的 BUG 或者功能(如有)，描述的越具体，采纳的可能性越高。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望效果
      placeholder: |
        请详细描述这个功能实现的效果。
    validations:
      required: true
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾您的回答
      options:
        - label: 我认为上述的描述已经足以详细，以便开发人员理解您想要的功能。如果我的 Issue 没有按照上述的要求填写，可能会被无条件关闭。
          required: true
